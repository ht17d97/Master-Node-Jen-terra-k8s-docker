apiVersion: v1
kind: Service
metadata:
  name: {{ include "amazon-app.fullname" . }}-service
  labels:
    managedby: {{ .Values.labels.managedby }}
    app: {{ .Values.app.name }}
spec:
  type: {{ .Values.service.type | default "NodePort" }}
  selector:
    managedby: {{ .Values.labels.managedby }}
    app: {{ .Values.app.name }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: {{ .Values.service.nodePort }}
    - name: https
      protocol: TCP
      port: 443
      targetPort: 80
      nodePort: {{ .Values.service.nodePortTLS }}


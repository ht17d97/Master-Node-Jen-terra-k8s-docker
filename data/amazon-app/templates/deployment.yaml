apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amazon-app.fullname" . }}-deploy
  labels:
    managedby: {{ .Values.labels.managedby }}
    app: {{ .Values.app.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      managedby: {{ .Values.labels.managedby }}
      app: {{ .Values.app.name }}
  template:
    metadata:
      name: amazon-site
      labels:
        managedby: {{ .Values.labels.managedby }}
        app: {{ .Values.app.name }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: amazon-html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: amazon-html
          configMap:
            name: {{ include "amazon-app.fullname" . }}-html


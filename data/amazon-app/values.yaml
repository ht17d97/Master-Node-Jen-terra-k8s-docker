replicaCount: 2

app:
  name: amazon.com

labels:
  managedby: HimT

image:
  repository: nginx
  tag: alpine

service:
  type: NodePort
  nodePort: 32081
  nodePortTLS: 32444

ingress:
  host: amazon.local
  tlsSecret: amazon-tls

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

html: |
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Clone - Front Page</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #eaeaea;
      }
      .navbar {
        background-color: #131921;
        color: white;
        display: flex;
        align-items: center;
        padding: 10px;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        margin-right: 20px;
      }
      .search-bar {
        flex: 1;
        display: flex;
      }
      .search-bar input {
        width: 100%;
        padding: 10px;
        border: none;
        outline: none;
      }
      .search-bar button {
        padding: 10px 20px;
        background-color: #febd69;
        border: none;
        cursor: pointer;
      }
      .nav-links {
        display: flex;
        gap: 15px;
        margin-left: 20px;
      }
      .nav-links div {
        cursor: pointer;
      }
      .main {
        padding: 20px;
      }
      .product {
        background-color: white;
        padding: 15px;
        margin: 10px;
        display: inline-block;
        width: 200px;
        text-align: center;
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
      }
      .product img {
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="logo">amazon</div>
      <div class="search-bar">
        <input type="text" placeholder="Search Amazon.in">
        <button>Search</button>
      </div>
      <div class="nav-links">
        <div>Sign In</div>
        <div>Orders</div>
        <div>Cart</div>
      </div>
    </div>
    <div class="main">
      <h2>Featured Products</h2>
      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product Image">
        <h4>Sample Product 1</h4>
        <p>₹999</p>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product Image">
        <h4>Sample Product 2</h4>
        <p>₹799</p>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product Image">
        <h4>Sample Product 3</h4>
        <p>₹1,499</p>
      </div>
    </div>
  </body>
  </html>

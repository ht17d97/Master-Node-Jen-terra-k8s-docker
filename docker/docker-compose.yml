version: '3.3'
services:
  redis:
    image: redis

  db:
    image: postgres:9.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

  vote:
    image: docker/example-voting-app-vote
    ports:
      - 5000:80
    links:
      - redis

  result:
    image: docker/example-voting-app-result
    ports:
      - 5001:80
    links:
      - db

  worker:
    image: docker/example-voting-app-worker
    links: 
      - redis
      - db

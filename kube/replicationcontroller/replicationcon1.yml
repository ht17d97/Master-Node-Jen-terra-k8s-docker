apiVersion: v1
kind: ReplicationController
metadata:
  name: HP-site
  labels:
    env: Prod
    type: front-end
spec:
  template:
    metadata: 
      name: HP-site
      labels: 
        env: Prod
        managedby: himanshu
    spec: 
      containers: 
        - name: pubgroupe-site-prod
          image: nginx
          ports:
            - containerPort: 80
  replicas: 3


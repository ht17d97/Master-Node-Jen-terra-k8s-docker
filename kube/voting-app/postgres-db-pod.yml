apiVersion: v1
kind: Pod
metadata: 
  name: postgres-db-pod
  labels:
    name: postgres-db
    app: voting-application
spec: 
  containers:
    - name: portgres-container
      image: postgres
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRE_PASSWORD
          value: "postgres"

